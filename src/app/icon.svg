<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Top Paper Sheet Gradient -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Printer Body Gradient -->
    <linearGradient id="printerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Printed Sheet Gradient -->
    <linearGradient id="printedSheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Cyan Glow Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.3" />

  <!-- Printer & Document Group -->
  <g filter="url(#shadow)">
    <!-- 1. Top Paper Sheet (Feeding into printer) -->
    <rect x="156" y="80" width="200" height="150" rx="14" fill="url(#sheetGrad)" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Header bar on top sheet (representing Exam / Document header) -->
    <rect x="180" y="112" width="152" height="14" rx="7" fill="#0d9488" />
    <!-- Text lines -->
    <rect x="180" y="138" width="120" height="10" rx="5" fill="#94a3b8" />
    <rect x="180" y="158" width="140" height="10" rx="5" fill="#94a3b8" />
    <rect x="180" y="178" width="90" height="10" rx="5" fill="#cbd5e1" />

    <!-- 2. Main Printer Body -->
    <rect x="86" y="200" width="340" height="165" rx="30" fill="url(#printerGrad)" stroke="#94a3b8" stroke-width="2" />

    <!-- Paper Intake Slot -->
    <rect x="140" y="206" width="232" height="12" rx="6" fill="#1e293b" />

    <!-- Front Control Panel Accent -->
    <rect x="120" y="250" width="90" height="14" rx="7" fill="#0f766e" />
    
    <!-- LED Indicators -->
    <circle cx="366" cy="256" r="9" fill="#10b981" />
    <circle cx="366" cy="256" r="14" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
    <circle cx="334" cy="256" r="6" fill="#38bdf8" />

    <!-- Paper Output Slot -->
    <rect x="124" y="306" width="264" height="16" rx="8" fill="#0f172a" />

    <!-- 3. Printed Exam Document Emerging from Output Slot -->
    <rect x="136" y="314" width="240" height="125" rx="16" fill="url(#printedSheetGrad)" stroke="#94a3b8" stroke-width="2" />

    <!-- Printed lines on output sheet -->
    <rect x="166" y="348" width="115" height="11" rx="5.5" fill="#475569" />
    <rect x="166" y="368" width="95" height="10" rx="5" fill="#64748b" />
    <rect x="166" y="388" width="105" height="10" rx="5" fill="#94a3b8" />
    <rect x="166" y="408" width="75" height="10" rx="5" fill="#cbd5e1" />

    <!-- 4. Success Checkmark Stamp Badge on Output Page -->
    <g filter="url(#badgeGlow)">
      <circle cx="328" cy="380" r="32" fill="#10b981" stroke="#ffffff" stroke-width="3" />
      <path d="M316 380 L325 389 L341 371" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>

